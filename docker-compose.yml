version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8082:8000"
    volumes:
      - ./backend:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8082
    ports:
      - "3000:80"
    depends_on:
      - backend

name: Build Docker Images

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Extract version information
        id: version
        run: |
          # If this is a tag push, use the tag name
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            # Otherwise use short commit SHA
            VERSION=$(echo $GITHUB_SHA | cut -c1-8)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Created version: $VERSION"

      # Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mymealplanner-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/mymealplanner-backend:${{ env.VERSION }}
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}

      # Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/mymealplanner-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/mymealplanner-frontend:${{ env.VERSION }}
          build-args: |
            VITE_API_URL=${{ vars.BACKEND_URL }}
            BUILD_VERSION=${{ env.VERSION }}